<div class="bg-white max-w-6xl w-full grid grid-cols-1 md:grid-cols-2 relative">
  
  <button 
    mat-icon-button
    class="!absolute top-4 right-4 z-10"
    (click)="close()"
    aria-label="Close">
    <mat-icon>close</mat-icon>
  </button>

  <div class="p-6 flex gap-4">
    <div class="flex flex-col gap-3 justify-start pt-2">
      @for (image of product.images.slice(0, 4); track $index) {
        <button 
          (click)="selectedImageIndex = $index"
          [ngClass]="{
            'bg-black border-black': selectedImageIndex === $index,
            'bg-white border-gray-300': selectedImageIndex !== $index
          }"
          class="w-3 h-3 rounded-full border-2 transition-all"
          [attr.aria-label]="'View image ' + ($index + 1)">
        </button>
      }
    </div>

      <div class="flex-1 overflow-y-auto max-h-[70vh] space-y-4">
      @for (image of product.images; track $index) {
        <div class="aspect-[3/4] bg-gray-50" [id]="'image-' + $index">
          <img
            [src]="image"
            [alt]="product.title"
            class="w-full h-full object-cover"/>
        </div>
      }
    </div>
  </div>

  <div class="p-6 md:p-10 flex flex-col">
    <h2 class="text-2xl md:text-3xl font-semibold mb-4">{{ product.title }}</h2>
    <p class="text-2xl font-medium mb-6">${{ product.price }}</p>

    <p class="text-gray-600 text-sm mb-6">
      {{ product.description }}
    </p>

    <div class="mb-6">
      <p class="text-sm font-medium mb-3">Color</p>
      <div class="flex gap-2">
        @for (color of colors; track $index) {
          <button
            (click)="selectedColorIndex = $index"
            class="!w-8 !h-8 !min-w-0 !p-0 rounded-full border-2 transition-all"
            [ngClass]="(selectedColorIndex === $index ?
              (color.bg + ' ' + color.border + ' scale-110') :
              (color.bg + ' border-gray-300 hover:border-black'))"
            [attr.aria-label]="color.name">
          </button>
        }
      </div>
    </div>

    <div class="mb-6">
      <div class="flex justify-between items-center mb-3">
        <p class="text-sm font-medium">Size</p>
        <button mat-button class="!text-sm !underline">Size Chart</button>
      </div>
      <div class="grid grid-cols-5 gap-2">
        @for (size of sizes; track size) {
          <button
            mat-stroked-button
            (click)="selectedSize = size"
            [ngClass]="{
              '!border-black !bg-black !text-white': selectedSize === size,
              '!border-gray-300 !bg-white !text-black': selectedSize !== size
            }" >
            {{ size }}
          </button>
        }
      </div>
    </div>

    <div class="flex gap-3 mt-auto">
      <button
        mat-flat-button
        (click)="addToBag()"
        class="flex-1 !rounded-md">
        Add to Bag
      </button>
      
      <button
        mat-icon-button
        (click)="toggleWishlist()"
        class="!border !border-gray-300">
        <mat-icon [ngClass]="{'text-red-500': isInWishlist}">
          {{ isInWishlist ? 'favorite' : 'favorite_border' }}
        </mat-icon>
      </button>
    </div>
  </div>

</div>
