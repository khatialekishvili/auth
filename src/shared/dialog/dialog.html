<div class="bg-white md:max-w-4xl grid grid-cols-1 md:grid-cols-2  relative">

  <button 
    class="absolute top-4 right-4 text-gray-500 hover:opacity-75 duration-200 text-black z-10"
    (click)="close()"
    aria-label="Close">
    ✕
  </button>

  <div class="hidden md:block">
    <img
      src="assets/hero1.png"
      alt="discount-image"
      class="h-full w-full object-cover"/>             
  </div>

  <div class="p-6 md:p-10 flex flex-col items-center text-center space-y-6">
    <p class="text-sm text-gray-600">Enter your email to unlock</p>
    <h2 class="text-3xl font-semibold">
      15% off your first order
    </h2>

    <p class="text-gray-600 text-sm leading-6 max-w-64 md:max-w-none">
      Plus, get insider access to promotions, launches, events, and more.
    </p>

    <input 
      type="email"
      [formControl]="emailControl"
      placeholder="Enter your email address"
      class="w-72 md:w-full border rounded-md border-gray-300 px-4 py-3 text-black"/>

    <button
      mat-flat-button
      (click)="submit()"
      class="w-72 !rounded-md">
      Unlock Access
    </button>

  </div>

</div>
